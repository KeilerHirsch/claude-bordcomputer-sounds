name: Bug report
description: Report a reproducible hook or playback problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please distinguish hook matching, player invocation, and missing/inaudible audio. Do not paste private hook payloads without redaction.
  - type: input
    id: version
    attributes:
      label: Project version / commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected path
      options:
        - play_sound.py
        - skill hook
        - memory/MCP hook
        - sound download helper
        - settings / mapping
        - other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What event fired, what sound was expected, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Include the relevant hook/tool name and whether the process returned, timed out, failed, or completed silently.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, audio player/backend, and Claude Code version if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal evidence
      description: Relevant stderr/stdout or redacted hook JSON only. Remove usernames, paths, credentials, prompts, and unrelated workflow data.
    validations:
      required: false
